name: Bluebolt Apply Fixes

on:
  issue_comment:
    types: [edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        default: '1'
      comment_id:
        description: 'Comment ID (leave blank for workflow_dispatch testing)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply-fixes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.login == 'github-actions[bot]' &&
       contains(github.event.comment.body, '- [x] ✅ Click to apply'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic mcp==1.28.1 python-dotenv requests

      - name: Apply fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.issue.number }}
          GH_COMMENT_ID: ${{ github.event.inputs.comment_id || github.event.comment.id }}
        run: python bluebolt-agent/19_apply_fixes.py