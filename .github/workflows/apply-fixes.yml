name: Bluebolt Apply Fixes

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to apply fixes for'
        required: true
        default: '1'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply-fixes:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'apply-sync-fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug - show actual checked out file
        run: |
          echo "=== Current commit SHA ==="
          git rev-parse HEAD
          echo "=== Confluence-related line in file ==="
          grep -n "body" bluebolt-agent/19_apply_fixes.py | head -10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic mcp==1.28.1 python-dotenv requests

      - name: Apply fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: python bluebolt-agent/19_apply_fixes.py
